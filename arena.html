<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArenaM — PvP</title>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #1a1a2e);
            --secondary: var(--tg-theme-secondary-bg-color, #16213e);
            --text: var(--tg-theme-text-color, #eaeaea);
            --hint: var(--tg-theme-hint-color, #8899aa);
            --btn: var(--tg-theme-button-color, #e94560);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --accent: #f5a623;
            --radius: 12px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #arena {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            gap: 10px;
        }

        .fighters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .fighter {
            background: var(--secondary);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .fighter.me {
            border-color: var(--btn);
        }
        .fighter.enemy {
            border-color: var(--hint);
        }

        .fighter-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hp-bar-wrap {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        .hp-bar {
            height: 100%;
            border-radius: 5px;
            transition: width 0.4s ease;
        }
        .hp-text {
            font-size: 11px;
            color: var(--hint);
        }

        .round-info {
            text-align: center;
            font-size: 13px;
            color: var(--hint);
            font-weight: 600;
        }
        .round-info span {
            color: var(--accent);
        }

        #countdown {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: var(--btn);
            min-height: 32px;
        }

        #action-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-label {
            font-size: 11px;
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .zone-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .zone-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 4px;
            border: 2px solid transparent;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
        }
        .zone-btn span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .zone-btn:active {
            transform: scale(0.93);
        }
        .zone-btn.selected {
            border-color: var(--accent);
            background: rgba(245, 166, 35, 0.15);
        }
        .zone-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #confirm-btn {
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            background: var(--btn);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.12s;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        #confirm-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #confirm-btn:active {
            transform: scale(0.97);
        }

        #log {
            flex: 1;
            overflow-y: auto;
            background: var(--secondary);
            border-radius: var(--radius);
            padding: 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 60px;
            max-height: 150px;
        }
        .log-entry {
            line-height: 1.4;
        }
        .log-entry.sys {
            color: var(--hint);
            font-style: italic;
        }
        .log-entry.dmg {
            color: #ff6b6b;
        }
        .log-entry.heal {
            color: #69f0ae;
        }
        .log-entry.win {
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
            text-align: center;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            backdrop-filter: blur(6px);
        }
        #overlay.hidden {
            display: none;
        }
        #overlay-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent);
        }
        #overlay-sub {
            font-size: 14px;
            color: var(--hint);
            text-align: center;
            padding: 0 20px;
        }
        #overlay-btn {
            padding: 12px 32px;
            border: none;
            border-radius: var(--radius);
            background: var(--btn);
            color: var(--btn-text);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes flash-red {
            0%, 100% { background: transparent; }
            50% { background: rgba(244, 67, 54, 0.3); }
        }
        @keyframes flash-green {
            0%, 100% { background: transparent; }
            50% { background: rgba(76, 175, 80, 0.3); }
        }
        .flash-dmg {
            animation: flash-red 0.5s ease;
        }
        .flash-heal {
            animation: flash-green 0.5s ease;
        }
    </style>
</head>
<body>

<div id="overlay">
    <div id="overlay-title">⚔️ ArenaM</div>
    <div id="overlay-sub">Подключение к серверу…</div>
    <button id="overlay-btn" style="display:none" onclick="location.reload()">🔄 Переподключиться</button>
</div>

<div id="arena">
    <div class="fighters">
        <div class="fighter me" id="card-me">
            <div class="fighter-name" id="name-me">Вы</div>
            <div class="hp-bar-wrap"><div class="hp-bar" id="hpbar-me" style="width:100%;background:#4caf50"></div></div>
            <div class="hp-text" id="hp-me">— / —</div>
        </div>
        <div class="fighter enemy" id="card-enemy">
            <div class="fighter-name" id="name-enemy">Соперник</div>
            <div class="hp-bar-wrap"><div class="hp-bar" id="hpbar-enemy" style="width:100%;background:#4caf50"></div></div>
            <div class="hp-text" id="hp-enemy">— / —</div>
        </div>
    </div>

    <div class="round-info">Раунд <span id="round-num">—</span></div>
    <div id="countdown"></div>

    <div id="action-panel">
        <div class="action-label">⚔️ Атака</div>
        <div class="zone-row" id="atk-row">
            <button class="zone-btn" data-zone="TOP" data-type="atk" onclick="selectZone(this)">⬆️<span>Верх</span></button>
            <button class="zone-btn" data-zone="MIDDLE" data-type="atk" onclick="selectZone(this)">➡️<span>Середина</span></button>
            <button class="zone-btn" data-zone="BOTTOM" data-type="atk" onclick="selectZone(this)">⬇️<span>Низ</span></button>
        </div>
        <div class="action-label">🛡️ Блок</div>
        <div class="zone-row" id="blk-row">
            <button class="zone-btn" data-zone="TOP" data-type="blk" onclick="selectZone(this)">⬆️<span>Верх</span></button>
            <button class="zone-btn" data-zone="MIDDLE" data-type="blk" onclick="selectZone(this)">➡️<span>Середина</span></button>
            <button class="zone-btn" data-zone="BOTTOM" data-type="blk" onclick="selectZone(this)">⬇️<span>Низ</span></button>
        </div>
        <button id="confirm-btn" disabled onclick="confirmAction()">Подтвердить ход</button>
    </div>

    <div id="log"></div>
</div>

<script>
    // ── Инициализация Telegram Web App ──
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    // ── Параметры из URL ──
    const params = new URLSearchParams(location.search);
    const BATTLE_ID = params.get('battle_id') || '';
    const USER_ID = parseInt(params.get('user_id') || '0');
    const CHAT_ID = params.get('chat_id') || '0';
    const WS_URL = params.get('ws_url') || 'wss://vvvty.onrender.com/ws';

    if (!BATTLE_ID || !USER_ID) {
        document.getElementById('overlay-title').textContent = '❌ Ошибка';
        document.getElementById('overlay-sub').textContent = 'Неверные параметры запуска';
        document.getElementById('overlay-btn').style.display = '';
        throw new Error('Missing parameters');
    }

    // ── Состояние ──
    let ws;
    let myAction = { atk: null, blk: null };
    let maxHp = {};
    let myId = USER_ID;
    let enemyId = null;
    let roundTimeout = 30;
    let roundEndAt = 0;
    let countdownInterval;

    // ── DOM helpers ──
    const $ = (id) => document.getElementById(id);

    function setOverlay(title, sub, showBtn = false) {
        $('overlay').classList.remove('hidden');
        $('overlay-title').textContent = title;
        $('overlay-sub').textContent = sub;
        $('overlay-btn').style.display = showBtn ? '' : 'none';
    }
    function hideOverlay() {
        $('overlay').classList.add('hidden');
    }

    function log(text, cls = '') {
        const el = document.createElement('div');
        el.className = 'log-entry ' + cls;
        el.textContent = text;
        $('log').appendChild(el);
        $('log').scrollTop = $('log').scrollHeight;
    }

    function updateHP(uid, hp) {
        const isMe = uid === myId;
        const max = maxHp[uid] || 1;
        const pct = Math.max(0, Math.min(100, (hp / max) * 100));
        const bar = $(isMe ? 'hpbar-me' : 'hpbar-enemy');
        const txt = $(isMe ? 'hp-me' : 'hp-enemy');
        const card = $(isMe ? 'card-me' : 'card-enemy');

        bar.style.width = pct + '%';
        bar.style.background = pct > 50 ? '#4caf50' : pct > 25 ? '#ff9800' : '#f44336';
        txt.textContent = `${hp} / ${max}`;

        card.classList.remove('flash-dmg', 'flash-heal');
        void card.offsetWidth;
        card.classList.add('flash-dmg');
    }

    function startCountdown(seconds) {
        clearInterval(countdownInterval);
        roundEndAt = Date.now() + seconds * 1000;
        const el = $('countdown');
        function tick() {
            const left = Math.ceil((roundEndAt - Date.now()) / 1000);
            if (left <= 0) {
                el.textContent = '⏰';
                clearInterval(countdownInterval);
                return;
            }
            el.textContent = left;
            el.style.color = left <= 5 ? '#f44336' : 'var(--btn)';
        }
        tick();
        countdownInterval = setInterval(tick, 200);
    }

    function stopCountdown() {
        clearInterval(countdownInterval);
        $('countdown').textContent = '';
    }

    function selectZone(btn) {
        const type = btn.dataset.type;
        const zone = btn.dataset.zone;
        const row = type === 'atk' ? 'atk-row' : 'blk-row';

        $(row).querySelectorAll('.zone-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');

        myAction[type] = zone;
        $('confirm-btn').disabled = !(myAction.atk && myAction.blk);
    }

    function resetActions(disable = false) {
        myAction = { atk: null, blk: null };
        document.querySelectorAll('.zone-btn').forEach(b => {
            b.classList.remove('selected');
            b.disabled = disable;
        });
        $('confirm-btn').disabled = true;
    }

    function confirmAction() {
        if (!myAction.atk || !myAction.blk || !ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(JSON.stringify({
            action: 'atk',
            zone: myAction.atk
        }));
        ws.send(JSON.stringify({
            action: 'blk',
            zone: myAction.blk
        }));

        resetActions(true);
        log('⏳ Ожидаем соперника…', 'sys');
    }

    // ── WebSocket ──
    function connect() {
        const url = `${WS_URL}?battle_id=${BATTLE_ID}&user_id=${USER_ID}&chat_id=${CHAT_ID}`;
        ws = new WebSocket(url);

        ws.onopen = () => {
            // Отправляем initData первым сообщением
            if (tg && tg.initData) {
                ws.send(JSON.stringify({ initData: tg.initData }));
            }
        };

        ws.onmessage = ({ data }) => {
            try {
                const msg = JSON.parse(data);
                handleMessage(msg);
            } catch (e) {
                console.error('Parse error:', e);
            }
        };

        ws.onerror = () => {
            setOverlay('🔌 Ошибка', 'Потеряно соединение с сервером', true);
        };

        ws.onclose = (e) => {
            clearInterval(countdownInterval);
            if (e.code !== 1000) {
                setOverlay('🔌 Отключено', `Код: ${e.code}`, true);
            }
        };
    }

    function handleMessage(msg) {
        switch (msg.type) {
            case 'waiting':
                setOverlay('⏳ Ожидание', msg.message || 'Ожидаем соперника…');
                break;

            case 'battle_start': {
                hideOverlay();
                roundTimeout = msg.round_timeout || 30;
                const players = msg.players;
                const me = players.find(p => p.user_id === myId);
                const enemy = players.find(p => p.user_id !== myId);

                if (me && enemy) {
                    enemyId = enemy.user_id;
                    maxHp[me.user_id] = me.max_hp;
                    maxHp[enemy.user_id] = enemy.max_hp;

                    $('name-me').textContent = me.name;
                    $('name-enemy').textContent = enemy.name;
                    updateHP(me.user_id, me.hp);
                    updateHP(enemy.user_id, enemy.hp);

                    $('round-num').textContent = '1';
                    log('🏟️ Бой начался!', 'sys');
                    resetActions(false);
                    startCountdown(roundTimeout);
                }
                break;
            }

            case 'round_result': {
                $('round-num').textContent = msg.round;
                stopCountdown();

                if (msg.log) {
                    msg.log.forEach(line => log(line, ''));
                }

                if (msg.hp) {
                    Object.entries(msg.hp).forEach(([uid, hp]) => updateHP(parseInt(uid), hp));
                }

                resetActions(false);
                startCountdown(roundTimeout);
                break;
            }

            case 'game_over': {
                stopCountdown();
                resetActions(true);

                if (msg.hp) {
                    Object.entries(msg.hp).forEach(([uid, hp]) => updateHP(parseInt(uid), hp));
                }

                if (msg.winner_id === null) {
                    log('🤝 Ничья!', 'win');
                    setOverlay('🤝 Ничья!', `Бой завершён на раунде ${msg.round}`);
                } else if (msg.winner_id === myId) {
                    log('🏆 Вы победили!', 'win');
                    setOverlay('🏆 Победа!', 'Вы одержали победу в дуэли!');
                } else {
                    log('💀 Вы проиграли', 'dmg');
                    setOverlay('💀 Поражение', 'Соперник оказался сильнее. Удачи в следующий раз!');
                }

                setTimeout(() => tg?.close?.(), 4000);
                break;
            }

            case 'error':
                log(`⚠️ ${msg.message}`, 'sys');
                break;
        }
    }

    // ── Старт ──
    setOverlay('⚔️ ArenaM', 'Подключение…');
    connect();
</script>
</body>
  </html>
