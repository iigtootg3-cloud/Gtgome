<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArenaM — PvP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg:        #0f0f1a;
            --panel:     #1a1a2e;
            --panel2:    #16213e;
            --text:      #eaeaea;
            --hint:      #8899aa;
            --btn:       #e94560;
            --btn-text:  #ffffff;
            --gold:      #f5a623;
            --gold-dim:  rgba(245,166,35,.18);
            --green:     #69f0ae;
            --red:       #ff5252;
            --orange:    #ff9800;
            --blue:      #90caf9;
            --bleed:     #c0392b;
            --radius:    14px;
            --r-sm:      8px;
            --font:      'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: .3px;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(245,166,35,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245,166,35,.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Overlay */
        #overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.88);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            gap: 16px; z-index: 200;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity .4s ease;
        }
        #overlay.hidden { display: none; }

        #overlay-icon { font-size: 54px; animation: icon-breathe 2s ease-in-out infinite; }
        @keyframes icon-breathe {
            0%,100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(245,166,35,.4)); }
            50%      { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(245,166,35,.8)); }
        }

        #overlay-title {
            font-size: 30px; font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(135deg, var(--gold) 0%, #fff 60%, var(--gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #overlay-sub { font-size: 14px; color: var(--hint); text-align: center; padding: 0 28px; line-height: 1.6; }

        #overlay-btn {
            display: none;
            padding: 13px 32px; border: 2px solid var(--btn); border-radius: var(--radius);
            background: transparent; color: var(--btn-text);
            font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: .5px;
            cursor: pointer; transition: background .2s, transform .1s;
            margin-top: 4px;
        }
        #overlay-btn:hover  { background: var(--btn); }
        #overlay-btn:active { transform: scale(.96); }

        #overlay.victory { background: radial-gradient(ellipse at center, rgba(245,166,35,.18) 0%, rgba(0,0,0,.92) 70%); }
        #overlay.defeat  { background: radial-gradient(ellipse at center, rgba(255,82,82,.14) 0%, rgba(0,0,0,.92) 70%); }

        .overlay-coins {
            font-size: 20px; font-weight: 700; color: var(--gold);
            background: rgba(245,166,35,.12); border: 1px solid rgba(245,166,35,.35);
            border-radius: 50px; padding: 6px 20px;
            animation: coin-pop .5s .3s cubic-bezier(.17,.67,.52,1.6) both;
        }
        @keyframes coin-pop {
            from { opacity:0; transform: scale(.5) translateY(12px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }

        .overlay-sparkle { font-size: 30px; letter-spacing: 8px; animation: sparkle 1s .6s ease both; }
        @keyframes sparkle {
            from { opacity:0; transform: scale(.6); }
            to   { opacity:1; transform: scale(1); }
        }

        .dots::after {
            content: ''; display: inline-block;
            animation: dots-loop 1.4s infinite;
        }
        @keyframes dots-loop {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }

        /* Arena layout */
        #arena {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            height: 100%; padding: 10px 10px 8px;
            gap: 7px;
        }

        /* Fighters */
        .fighters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .fighter {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 10px 10px 8px;
            display: flex; flex-direction: column; gap: 5px;
            border: 2px solid transparent;
            transition: border-color .35s, box-shadow .35s, background .45s;
            position: relative; overflow: visible;
        }
        .fighter.me    { border-color: rgba(233,69,96,.55); box-shadow: 0 0 14px rgba(233,69,96,.12); }
        .fighter.enemy { border-color: rgba(136,153,170,.35); box-shadow: 0 0 14px rgba(136,153,170,.06); }

        .fighter.winner {
            border-color: var(--gold) !important;
            box-shadow: 0 0 0 1px rgba(245,166,35,.3), 0 0 22px rgba(245,166,35,.35) !important;
            animation: winner-pulse 1.6s ease-in-out infinite;
        }
        .fighter.loser  {
            border-color: var(--red) !important;
            box-shadow: 0 0 0 1px rgba(255,82,82,.3), 0 0 20px rgba(255,82,82,.2) !important;
            filter: saturate(.5) brightness(.75);
        }
        @keyframes winner-pulse {
            0%,100% { box-shadow: 0 0 0 1px rgba(245,166,35,.3), 0 0 22px rgba(245,166,35,.35); }
            50%      { box-shadow: 0 0 0 2px rgba(245,166,35,.5), 0 0 38px rgba(245,166,35,.55); }
        }

        .fighter-header { display: flex; align-items: center; gap: 6px; }
        .fighter-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--btn), #6c3483);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
            border: 1.5px solid rgba(255,255,255,.12);
        }
        .fighter.enemy .fighter-avatar {
            background: linear-gradient(135deg, #1a6b8a, #0f3460);
        }
        .fighter-name {
            font-size: 14px; font-weight: 700; letter-spacing: .5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1;
        }
        .fighter-tag {
            font-size: 9px; font-weight: 600; letter-spacing: .8px;
            padding: 2px 6px; border-radius: 4px;
            flex-shrink: 0;
        }
        .fighter.me    .fighter-tag { background: rgba(233,69,96,.2); color: var(--btn); border: 1px solid rgba(233,69,96,.3); }
        .fighter.enemy .fighter-tag { background: rgba(136,153,170,.1); color: var(--hint); border: 1px solid rgba(136,153,170,.2); }

        /* HP Bar */
        .hp-row { display: flex; align-items: center; gap: 6px; }
        .hp-bar-wrap {
            flex: 1; height: 8px;
            background: rgba(255,255,255,.08);
            border-radius: 4px; overflow: hidden;
        }
        .hp-bar { height: 100%; border-radius: 4px; transition: width .4s cubic-bezier(.4,0,.2,1), background .4s; }
        .hp-text { font-size: 10px; color: var(--hint); font-weight: 600; flex-shrink: 0; white-space: nowrap; }

        /* Debuffs */
        .debuffs { display: flex; flex-wrap: wrap; gap: 4px; min-height: 14px; }
        .debuff-badge {
            font-size: 9px; font-weight: 600; letter-spacing: .3px;
            background: rgba(192,57,43,.22);
            border: 1px solid rgba(192,57,43,.5);
            border-radius: 4px; padding: 2px 6px; color: #ff8a80;
            animation: badge-pop .25s cubic-bezier(.17,.67,.52,1.6) both;
        }
        @keyframes badge-pop {
            from { transform: scale(.5) rotate(-6deg); opacity:0; }
            to   { transform: scale(1)  rotate(0deg);  opacity:1; }
        }

        /* Float numbers */
        .float-num {
            position: absolute;
            top: 2px; left: 50%;
            transform: translateX(-50%);
            font-family: var(--font);
            font-size: 20px; font-weight: 700;
            pointer-events: none; z-index: 50;
            animation: float-up 1.3s cubic-bezier(.22,.61,.36,1) forwards;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 20px currentColor;
            will-change: transform, opacity;
        }
        .float-num.dmg   { color: var(--red); }
        .float-num.crit  {
            color: #ff1744; font-size: 26px;
            animation: float-up-crit 1.4s cubic-bezier(.22,.61,.36,1) forwards;
        }
        .float-num.block { color: var(--blue); font-size: 14px; font-weight: 600; letter-spacing: .5px; }
        .float-num.vamp  { color: var(--green); }

        @keyframes float-up {
            0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            15%  { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1.1); }
            80%  { opacity: .9; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-58px) scale(.85); }
        }
        @keyframes float-up-crit {
            0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(.8); }
            12%  { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.3); }
            30%  { transform: translateX(-50%) translateY(-14px) scale(1.15); }
            80%  { opacity: .9; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-68px) scale(.9); }
        }

        /* Flash */
        @keyframes flash-red {
            0%,100% { background: var(--panel); }
            20%,60% { background: rgba(255,82,82,.28); }
        }
        @keyframes flash-green {
            0%,100% { background: var(--panel); }
            40%     { background: rgba(105,240,174,.22); }
        }
        .flash-dmg  { animation: flash-red   .6s ease; }
        .flash-heal { animation: flash-green .6s ease; }

        /* Round / countdown */
        .round-row {
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .round-info {
            font-size: 11px; color: var(--hint); font-weight: 600;
            letter-spacing: .8px; text-transform: uppercase;
        }
        .round-info span { color: var(--gold); font-size: 13px; }

        #countdown-wrap {
            display: flex; align-items: center; justify-content: center;
            gap: 6px;
        }
        #countdown {
            font-size: 26px; font-weight: 700; color: var(--btn); min-width: 40px;
            text-align: center; line-height: 1;
            transition: color .2s;
            text-shadow: 0 0 12px currentColor;
        }
        #countdown.urgent {
            color: var(--red);
            animation: countdown-pulse .5s ease-in-out infinite;
        }
        @keyframes countdown-pulse {
            0%,100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }
        .countdown-ring {
            position: relative; width: 34px; height: 34px; flex-shrink: 0;
        }
        .countdown-ring svg { transform: rotate(-90deg); }
        .countdown-ring circle { transition: stroke-dashoffset .25s linear; }

        /* Log */
        #log-wrap {
            background: var(--panel); border-radius: var(--radius);
            display: flex; flex-direction: column;
            flex: 1 1 0; min-height: 50px; max-height: 130px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.05);
        }
        #log-header {
            font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--hint); padding: 5px 10px 4px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            flex-shrink: 0; font-weight: 600;
        }
        #log {
            padding: 5px 10px; font-size: 11px; font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-y: auto; flex: 1;
            display: flex; flex-direction: column; gap: 2px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent;
        }
        #log::-webkit-scrollbar { width: 3px; }
        #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
        .log-entry { line-height: 1.5; }
        .log-entry.sys  { color: var(--hint); font-style: italic; }
        .log-entry.dmg  { color: #ff8080; }
        .log-entry.heal { color: var(--green); }
        .log-entry.win  { color: var(--gold); font-weight: 700; font-size: 13px; text-align: center; margin: 2px 0; }
        .log-entry.sep  { color: rgba(255,255,255,.15); font-size: 10px; }

        /* Action panel */
        #action-panel { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }

        .action-label {
            font-size: 9px; color: var(--hint);
            text-transform: uppercase; letter-spacing: .8px;
            font-weight: 600; margin-bottom: 0;
        }

        .zone-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }

        .zone-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            padding: 8px 4px;
            border: 2px solid rgba(255,255,255,.08);
            border-radius: var(--r-sm);
            background: rgba(255,255,255,.04);
            color: var(--text);
            font-size: 18px; cursor: pointer;
            transition: border-color .15s, background .15s, transform .1s, box-shadow .15s;
            font-family: var(--font);
            position: relative; overflow: hidden;
        }
        .zone-btn::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(245,166,35,.25) 0%, transparent 70%);
            opacity: 0; transition: opacity .2s;
        }
        .zone-btn span { font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--hint); }
        .zone-btn:active:not(:disabled) { transform: scale(.91); }
        .zone-btn.selected {
            border-color: var(--gold);
            background: rgba(245,166,35,.12);
            box-shadow: 0 0 10px rgba(245,166,35,.25), inset 0 0 8px rgba(245,166,35,.06);
        }
        .zone-btn.selected::before { opacity: 1; }
        .zone-btn.selected span { color: var(--gold); }
        .zone-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

        #confirm-btn {
            padding: 13px; border: none; border-radius: var(--radius);
            background: linear-gradient(135deg, var(--btn) 0%, #c0392b 100%);
            color: var(--btn-text);
            font-family: var(--font);
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: opacity .2s, transform .1s, box-shadow .2s;
            letter-spacing: .6px; margin-top: 2px;
            box-shadow: 0 4px 14px rgba(233,69,96,.35);
            text-transform: uppercase;
        }
        #confirm-btn:disabled {
            opacity: .35; cursor: not-allowed;
            background: rgba(255,255,255,.08); box-shadow: none;
        }
        #confirm-btn:active:not(:disabled) { transform: scale(.97); }
        #confirm-btn:not(:disabled):hover { box-shadow: 0 4px 20px rgba(233,69,96,.55); }

        .section-sep {
            height: 1px; background: rgba(255,255,255,.06);
            border-radius: 1px; margin: 1px 0;
        }
    </style>
</head>
<body>

<!-- Overlay -->
<div id="overlay">
    <div id="overlay-icon">⚔️</div>
    <div id="overlay-title">ArenaM</div>
    <div id="overlay-sub"><span class="dots">Подключение к серверу</span></div>
    <div id="overlay-extra"></div>
    <button id="overlay-btn" onclick="location.reload()">🔄 Переподключиться</button>
</div>

<!-- Arena -->
<div id="arena">

    <!-- Fighters -->
    <div class="fighters">
        <div class="fighter me" id="card-me">
            <div class="fighter-header">
                <div class="fighter-avatar" id="avatar-me">⚔️</div>
                <div class="fighter-name" id="name-me">Вы</div>
                <div class="fighter-tag">ВЫ</div>
            </div>
            <div class="hp-row">
                <div class="hp-bar-wrap"><div class="hp-bar" id="hpbar-me" style="width:100%;background:#69f0ae"></div></div>
                <div class="hp-text" id="hp-me">—/—</div>
            </div>
            <div class="debuffs" id="debuffs-me"></div>
        </div>

        <div class="fighter enemy" id="card-enemy">
            <div class="fighter-header">
                <div class="fighter-avatar" id="avatar-enemy">🗡️</div>
                <div class="fighter-name" id="name-enemy">Соперник</div>
                <div class="fighter-tag">ВРГ</div>
            </div>
            <div class="hp-row">
                <div class="hp-bar-wrap"><div class="hp-bar" id="hpbar-enemy" style="width:100%;background:#69f0ae"></div></div>
                <div class="hp-text" id="hp-enemy">—/—</div>
            </div>
            <div class="debuffs" id="debuffs-enemy"></div>
        </div>
    </div>

    <!-- Round / Timer -->
    <div class="round-row">
        <div class="round-info">Раунд <span id="round-num">—</span></div>
        <div id="countdown-wrap">
            <div class="countdown-ring" id="ring-wrap">
                <svg width="34" height="34" viewBox="0 0 34 34">
                    <circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="3"/>
                    <circle id="ring-arc" cx="17" cy="17" r="14" fill="none"
                        stroke="#e94560" stroke-width="3" stroke-linecap="round"
                        stroke-dasharray="87.96" stroke-dashoffset="0"/>
                </svg>
                <div id="countdown" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;min-width:auto;text-shadow:none;"></div>
            </div>
        </div>
    </div>

    <!-- Log -->
    <div id="log-wrap">
        <div id="log-header">📜 Лог боя</div>
        <div id="log"></div>
    </div>

    <!-- Action Panel -->
    <div id="action-panel">
        <div class="action-label">⚔️ Зона атаки</div>
        <div class="zone-row" id="atk-row">
            <button class="zone-btn" data-zone="TOP"    data-type="atk" onclick="selectZone(this)">⬆️<span>Верх</span></button>
            <button class="zone-btn" data-zone="MIDDLE" data-type="atk" onclick="selectZone(this)">➡️<span>Центр</span></button>
            <button class="zone-btn" data-zone="BOTTOM" data-type="atk" onclick="selectZone(this)">⬇️<span>Низ</span></button>
        </div>
        <div class="section-sep"></div>
        <div class="action-label">🛡️ Зона блока</div>
        <div class="zone-row" id="blk-row">
            <button class="zone-btn" data-zone="TOP"    data-type="blk" onclick="selectZone(this)">⬆️<span>Верх</span></button>
            <button class="zone-btn" data-zone="MIDDLE" data-type="blk" onclick="selectZone(this)">➡️<span>Центр</span></button>
            <button class="zone-btn" data-zone="BOTTOM" data-type="blk" onclick="selectZone(this)">⬇️<span>Низ</span></button>
        </div>
        <button id="confirm-btn" disabled onclick="confirmAction()">Подтвердить ход</button>
    </div>

</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function getParams() {
        const u = new URLSearchParams(window.location.search);
        const h = new URLSearchParams(window.location.hash.slice(1));
        const get = k => u.get(k) || h.get(k);
        return {
            battle_id: get('battle_id'),
            user_id:   get('user_id'),
            chat_id:   get('chat_id'),
            ws_url:    get('ws_url') || 'wss://vvvty.onrender.com/ws',
        };
    }

    const P         = getParams();
    const BATTLE_ID = P.battle_id || '';
    const USER_ID   = parseInt(P.user_id || '0', 10);
    const CHAT_ID   = P.chat_id || '0';
    const WS_URL    = P.ws_url;

    if (!BATTLE_ID || !USER_ID) {
        setOverlay('❌ Ошибка', 'Неверные параметры запуска', true);
        throw new Error('Missing parameters');
    }

    let ws;
    let myAction     = { atk: null, blk: null };
    let maxHp        = {};
    let myId         = USER_ID;
    let enemyId      = null;
    let roundTimeout = 30;
    let roundEndAt   = 0;
    let countdownInterval;
    let ringTotal    = 87.96;

    const $ = id => document.getElementById(id);

    function setOverlay(title, sub, showBtn = false, mode = '') {
        const ov = $('overlay');
        ov.className = mode ? `${mode}` : '';
        ov.classList.remove('hidden');
        $('overlay-title').textContent = title;
        $('overlay-sub').innerHTML     = sub;
        $('overlay-btn').style.display = showBtn ? '' : 'none';
        $('overlay-extra').innerHTML   = '';
    }

    function setVictoryOverlay(isWin) {
        const ov = $('overlay');
        ov.classList.remove('hidden');
        ov.className = isWin ? 'victory' : 'defeat';
        $('overlay-icon').textContent  = isWin ? '🏆' : '💀';
        $('overlay-title').textContent = isWin ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ';
        $('overlay-sub').textContent   = isWin ? 'Отличная работа, боец!' : 'Противник оказался сильнее.';
        $('overlay-btn').style.display = 'none';
        const extra = $('overlay-extra');
        if (isWin) extra.innerHTML = '<div class="overlay-sparkle">✨ 🥇 ✨</div>';
    }

    function hideOverlay() { $('overlay').classList.add('hidden'); }

    function addLog(text, cls = '') {
        const el = document.createElement('div');
        el.className = 'log-entry ' + cls;
        el.textContent = text;
        $('log').appendChild(el);
        $('log').scrollTop = $('log').scrollHeight;
    }

    function updateHP(uid, hp, flash = true) {
        const isMe = (uid === myId);
        const max  = maxHp[uid] || 1;
        const pct  = Math.max(0, Math.min(100, (hp / max) * 100));
        const bar  = $(isMe ? 'hpbar-me'  : 'hpbar-enemy');
        const txt  = $(isMe ? 'hp-me'     : 'hp-enemy');
        const card = $(isMe ? 'card-me'   : 'card-enemy');
        bar.style.width      = pct + '%';
        bar.style.background = pct > 50 ? '#69f0ae' : pct > 25 ? '#ff9800' : '#ff5252';
        txt.textContent = `${hp}/${max}`;
        if (flash) {
            card.classList.remove('flash-dmg', 'flash-heal');
            void card.offsetWidth;
            card.classList.add('flash-dmg');
        }
    }

    function showFloatNum(isMe, text, cls) {
        const card = $(isMe ? 'card-me' : 'card-enemy');
        const el   = document.createElement('div');
        el.className = 'float-num ' + cls;
        el.textContent = text;
        card.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    }

    function renderDebuffs(uid, debuffs) {
        const isMe = (uid === myId);
        const wrap = $(isMe ? 'debuffs-me' : 'debuffs-enemy');
        wrap.innerHTML = '';
        (debuffs || []).forEach(d => {
            const badge = document.createElement('span');
            badge.className   = 'debuff-badge';
            badge.textContent = d;
            wrap.appendChild(badge);
        });
    }

    function processCombat(combat) {
        if (!combat) return;
        Object.entries(combat).forEach(([uidStr, info]) => {
            const uid  = parseInt(uidStr, 10);
            const isMe = (uid === myId);
            if (info.dmg_taken > 0) {
                const cls  = info.crit ? 'crit' : 'dmg';
                const text = info.crit ? `💥 ${info.dmg_taken}` : `-${info.dmg_taken}`;
                showFloatNum(isMe, text, cls);
            }
            if (info.blocked) showFloatNum(isMe, '🛡 БЛОК', 'block');
            if (info.vampirism > 0) showFloatNum(isMe, `🧛 +${info.vampirism}`, 'vamp');
            renderDebuffs(uid, info.debuffs);
        });
    }

    function startCountdown(seconds) {
        clearInterval(countdownInterval);
        roundEndAt = Date.now() + seconds * 1000;
        const el  = $('countdown');
        const arc = $('ring-arc');
        function tick() {
            const left = Math.ceil((roundEndAt - Date.now()) / 1000);
            const safe = Math.max(0, left);
            el.textContent = safe;
            const pct = safe / seconds;
            const offset = ringTotal * (1 - pct);
            if (arc) arc.style.strokeDashoffset = offset;
            const isUrgent = safe <= 5;
            el.classList.toggle('urgent', isUrgent);
            if (arc) arc.style.stroke = isUrgent ? '#ff5252' : '#e94560';
            if (safe <= 0) { clearInterval(countdownInterval); el.textContent = '⏰'; }
        }
        tick();
        countdownInterval = setInterval(tick, 250);
    }

    function stopCountdown() {
        clearInterval(countdownInterval);
        const el = $('countdown');
        if (el) { el.textContent = ''; el.classList.remove('urgent'); }
        const arc = $('ring-arc');
        if (arc) arc.style.strokeDashoffset = '0';
    }

    function selectZone(btn) {
        const type = btn.dataset.type;
        const row  = type === 'atk' ? 'atk-row' : 'blk-row';
        $(row).querySelectorAll('.zone-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        myAction[type] = btn.dataset.zone;
        $('confirm-btn').disabled = !(myAction.atk && myAction.blk);
    }

    function resetActions(disable = false) {
        myAction = { atk: null, blk: null };
        document.querySelectorAll('.zone-btn').forEach(b => {
            b.classList.remove('selected');
            b.disabled = disable;
        });
        $('confirm-btn').disabled = true;
    }

    function confirmAction() {
        if (!myAction.atk || !myAction.blk || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ action: 'atk', zone: myAction.atk }));
        ws.send(JSON.stringify({ action: 'blk', zone: myAction.blk }));
        resetActions(true);
        addLog('⏳ Ход отправлен, ждём соперника…', 'sys');
    }

    function connect() {
        const url = `${WS_URL}?battle_id=${BATTLE_ID}&user_id=${USER_ID}&chat_id=${CHAT_ID}`;
        ws = new WebSocket(url);
        ws.onopen = () => {
            ws.send(JSON.stringify({ initData: tg?.initData || '' }));
        };
        ws.onmessage = ({ data }) => {
            try { handleMessage(JSON.parse(data)); }
            catch (e) { console.error('Parse error', e); }
        };
        ws.onerror = () => setOverlay('🔌 Ошибка', 'Потеряно соединение с сервером', true);
        ws.onclose = e => {
            clearInterval(countdownInterval);
            if (e.code !== 1000) setOverlay('🔌 Отключено', `Соединение прервано (код ${e.code})`, true);
        };
    }

    function handleMessage(msg) {
        switch (msg.type) {
            case 'waiting':
                setOverlay('⏳ Ожидание', msg.message || '<span class="dots">Ищем соперника</span>');
                break;
            case 'battle_start': {
                hideOverlay();
                roundTimeout = msg.round_timeout || 30;
                const me    = msg.players.find(p => parseInt(p.user_id, 10) === myId);
                const enemy = msg.players.find(p => parseInt(p.user_id, 10) !== myId);
                if (!me || !enemy) { addLog('⚠️ Не удалось определить игроков', 'sys'); break; }
                enemyId = parseInt(enemy.user_id, 10);
                maxHp[myId]    = me.max_hp;
                maxHp[enemyId] = enemy.max_hp;
                $('name-me').textContent    = me.name    || 'Вы';
                $('name-enemy').textContent = enemy.name || 'Соперник';
                updateHP(myId,    me.hp,    false);
                updateHP(enemyId, enemy.hp, false);
                $('round-num').textContent = '1';
                addLog('🏟️ Бой начался! Удачи, боец!', 'sys');
                resetActions(false);
                startCountdown(roundTimeout);
                break;
            }
            case 'round_result': {
                $('round-num').textContent = msg.round;
                stopCountdown();
                addLog(`── Раунд ${msg.round} ──`, 'sep');
                if (msg.log) {
                    msg.log.forEach(line => {
                        let cls = '';
                        if (line.startsWith('═══'))  cls = 'sep';
                        else if (line.includes('HP:')) cls = 'sys';
                        else if (line.includes('+') && line.includes('HP')) cls = 'heal';
                        else if (line.includes('урон') || line.includes('Кровотечение')) cls = 'dmg';
                        addLog(line, cls);
                    });
                }
                if (msg.hp) {
                    Object.entries(msg.hp).forEach(([uid, hp]) => updateHP(parseInt(uid, 10), hp));
                }
                processCombat(msg.combat);
                resetActions(false);
                startCountdown(roundTimeout);
                break;
            }
            case 'game_over': {
                stopCountdown();
                resetActions(true);
                if (msg.hp) {
                    Object.entries(msg.hp).forEach(([uid, hp]) => updateHP(parseInt(uid, 10), hp, false));
                }
                const winnerId = msg.winner_id ? parseInt(msg.winner_id, 10) : null;
                if (winnerId === null) {
                    addLog('🤝 Ничья!', 'win');
                    setOverlay('🤝 Ничья!', `Бой завершён после раунда ${msg.round}`);
                } else if (winnerId === myId) {
                    addLog('🏆 Вы победили!', 'win');
                    $('card-me').classList.add('winner');
                    $('card-enemy').classList.add('loser');
                    setVictoryOverlay(true);
                } else {
                    addLog('💀 Вы проиграли', 'dmg');
                    $('card-enemy').classList.add('winner');
                    $('card-me').classList.add('loser');
                    setVictoryOverlay(false);
                }
                setTimeout(() => tg?.close?.(), 5000);
                break;
            }
            case 'error':
                addLog(`⚠️ ${msg.message || 'Неизвестная ошибка'}`, 'sys');
                break;
        }
    }

    setOverlay('⚔️ ArenaM', '<span class="dots">Подключение к серверу</span>');
    connect();
</script>
</body>
</html>
